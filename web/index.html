<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI_SCOPE</title>
<link rel="icon" href="/favicon.ico">
<script>window.AI_SCOPE_SETTINGS = /*__SETTINGS__*/{}; (function(){ var t = (window.AI_SCOPE_SETTINGS || {}).theme; if (t === 'dark' || t === 'magenta' || t === 'neo' || t === 'eva') document.documentElement.dataset.theme = t; })();</script>
<link rel="stylesheet" href="/app.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;800&display=swap">
</head>
<body>
<nav class="topbar">
  <a class="brand" href="#home">AI<span>_</span>SCOPE</a>

  </div>

    </button>
  </div>
</nav>
<div class="empty" id="noTabs" hidden>No scopes open. Click <b>+</b> to open one.</div>

<section class="panel home" data-panel="home" hidden>
  <canvas id="homeBg" aria-hidden="true"></canvas>
  <div class="vignette"></div>
  <div class="hero">
    <h1 class="mark">AI<span>_</span>SCOPE</h1>
    <p class="sub">Local AI monitor</p>
    <a class="go" id="homeGo" href="#scopes">Open dashboard &rarr;</a>
  </div>
</section>

<section class="panel" data-panel="scopes">
  <div class="section-head">
    <h1>Scopes</h1>
    <span class="meta">Click a scope to open it</span>
  </div>
  <div class="wrap"><div id="gallery"></div></div>
</section>
<dialog class="modal" id="scopeDlg"><form method="dialog" id="scopeForm" novalidate></form></dialog>

<section class="panel" data-panel="comfyui">
  <div class="section-head">
    <h1>ComfyUI &mdash; Workflow Runs</h1>
  </div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- ComfyUI lenses (web/js/comfyui.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="ollama">
  <div class="section-head">
    <h1>Ollama &mdash; Models &amp; Requests</h1>
    <button class="helpbtn" id="oHeadHelpBtn" type="button" title="How to send requests through the AI_SCOPE relay" aria-expanded="false" hidden>?</button>
  </div>
  <div class="wrap"><div class="card helpcard" id="oHeadHelp" hidden></div></div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- Ollama lenses (web/js/ollama.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="strata">
  <div class="section-head">
    <h1>Strata &mdash; Model &amp; Requests</h1>
  </div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- Strata lenses (web/js/strata.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="llamacpp">
  <div class="section-head">
    <h1>llama.cpp &mdash; Model &amp; Requests</h1>
  </div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- llama.cpp lenses (web/js/llamacpp.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="hardware">
  <div class="section-head">
    <h1>Hardware</h1>
  </div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- Hardware lenses (web/js/hardware.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="processes">
  <div class="section-head">
    <h1>Processes</h1>
  </div>
  <div class="wrap"><div class="cgrid" data-cgrid><!-- Processes lenses (web/js/processes.js, layout.js) --></div></div>
</section>

<section class="panel" data-panel="bionic">
<div class="section-head">
  <h1>Bionic &mdash; Models &amp; Requests</h1>
</div>
<div class="wrap"><div class="cgrid" data-cgrid><!-- Bionic lenses (web/js/bionic.js, layout.js) --></div></div>
</section>
<script>window.AI_SCOPE_SCOPES = /*__SCOPES__*/[]; window.AI_SCOPE_CUSTOM = /*__CUSTOM__*/[]; window.AI_SCOPE_LAYOUTS = /*__LAYOUTS__*/{}; window.AI_SCOPE_OS = /*__OS__*/'';</script>
<!-- Client code, plain scripts in this order: shared helpers, one file per scope, then the shell (tabs, theme, gallery). -->
<script src="/js/core.js"></script>
<script src="/js/lens.js"></script>
<script src="/js/hardware.js"></script>
<script src="/js/mirror.js"></script>
<script src="/js/processes.js"></script>
<script src="/js/comfyui.js"></script>
<script src="/js/ollama.js"></script>

<script src="/js/custom.js"></script>

</html>
