# Runs when you publish a GitHub release (tag like v1.2.0):
#  1. builds ai-scope.zip (Windows) and ai-scope.tar.gz (macOS/Linux) and attaches them to the
#     release together with install.ps1 and install.sh - the installers download from
#     .../releases/latest/download/, so they always get the newest release;
#  2. optionally publishes the same version to npm (for `npx ai-scope`).
#     Off until you set the repository variable NPM_PUBLISH = true
#     (Settings -> Secrets and variables -> Actions -> Variables) and set up npm trusted publishing
#     for this workflow (release.yml) on npmjs.com. No npm token is stored in GitHub.
name: Release
on:
  release:
    types: [published]

jobs:
  assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # upload files to the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Release tag must match package.json version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          VER="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$VER" ]; then
            echo "Release tag v$TAG does not match package.json version $VER - bump the version first."
            exit 1
          fi
      - name: Syntax check
        run: for f in *.js bin/*.js web/js/*.js; do node --check "$f"; done
      - name: Point the installers at this repository (matters for forks or a renamed repo)
        run: sed -i "s#quantiqueue/ai_scope#${GITHUB_REPOSITORY}#g" install/install.ps1 install/install.sh
      - name: Build ai-scope.zip and ai-scope.tar.gz
        run: |
          npm pack
          mkdir stage
          tar -xzf ai-scope-*.tgz -C stage --strip-components=1
          cp -r install stage/install
          (cd stage && zip -qr ../ai-scope.zip . && tar -czf ../ai-scope.tar.gz .)
          ls -l ai-scope.zip ai-scope.tar.gz
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" ai-scope.zip ai-scope.tar.gz install/install.ps1 install/install.sh --clobber

  npm:
    needs: assets
    if: ${{ vars.NPM_PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Use a recent npm (trusted publishing needs npm 11.5.1+)
        run: npm install -g npm@latest
      - run: npm publish --access public
